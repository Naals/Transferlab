services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transferlab
      POSTGRES_USER: transferlab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U transferlab -d transferlab
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: